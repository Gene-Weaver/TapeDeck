<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:;">
<title>TapeDeck</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="logo"></span><span>TapeDeck</span></div>
  <div class="tape-ctl">
    <label for="tapeMm">Tape</label>
    <select id="tapeMm">
      <option value="4">3.5 mm</option>
      <option value="6" selected>6 mm</option>
      <option value="9">9 mm</option>
      <option value="12">12 mm</option>
      <option value="18">18 mm</option>
      <option value="24">24 mm</option>
    </select>
    <span id="tapeInfo" class="muted"></span>
  </div>
  <div id="printerPill" class="pill pill-off" title="Printer status"><span class="dot"></span><span class="txt">Looking for printer…</span></div>
  <button id="btnSettings" class="icon-btn" title="Settings">⚙</button>
</header>

<main class="workspace">
  <!-- LABELS -->
  <section class="card" id="cardLabels">
    <div class="card-head">
      <h2>Labels</h2>
      <div class="seg" id="modeSeg">
        <button data-mode="pattern" class="active">Pattern</button>
        <button data-mode="single">Text</button>
        <button data-mode="batch">List</button>
      </div>
    </div>

    <div id="mode-pattern" class="mode">
      <div class="seg-head"><span>Name</span><span>Kind</span><span>Value / range</span><span></span></div>
      <div id="segments" class="segments"></div>
      <div class="row">
        <button id="segAdd" class="small">+ Add segment</button>
        <label class="lbl">Separator <input id="patSep" value="-" maxlength="3" style="width:3.2em;text-align:center"></label>
      </div>
      <div class="series" id="patSummary"></div>
      <div class="row range">
        <span>Print labels</span>
        <input type="number" id="patFrom" min="1" value="1">
        <span>to</span>
        <input type="number" id="patTo" min="1" value="3">
        <span id="patOf" class="muted"></span>
        <button id="patAll" class="small">All</button>
      </div>
    </div>

    <div id="mode-single" class="mode hidden">
      <label class="field"><span>Text <small>(Enter for a new line)</small></span><textarea id="singleText" rows="2">Hello tape</textarea></label>
      <label class="field"><span>Copies</span><input type="number" id="singleCopies" value="1" min="1" max="999" style="width:6em"></label>
    </div>

    <div id="mode-batch" class="mode hidden">
      <label class="field"><span>One label per line, or CSV/TSV <small>(paste, or <button type="button" id="btnBatchFile" class="link">load a file</button>)</small></span>
        <textarea id="batchText" rows="8" spellcheck="false" placeholder="Quercus alba&#10;Acer saccharum&#10;Betula papyrifera"></textarea></label>
      <input type="file" id="batchFile" accept=".csv,.tsv,.txt" hidden>
      <label class="check"><input type="checkbox" id="batchHeader"> First row is a header</label>
      <label class="field"><span>Format <small>(optional; columns as tokens)</small></span><input id="batchTpl" placeholder="{c1}  or  {name} #{id}" spellcheck="false"></label>
      <div class="series" id="batchSample"></div>
    </div>

    <div class="hint" id="tokenHint"></div>
  </section>

  <!-- LAYOUT -->
  <section class="card" id="cardLayout">
    <div class="card-head">
      <h2>Layout</h2>
      <div class="group">
        <button data-add="text" class="small" title="Add text">T Text</button>
        <button data-add="image" class="small" title="Add a photo">▣ Photo</button>
        <button data-add="qr" class="small">▦ QR</button>
        <button data-add="barcode" class="small">▥ Barcode</button>
        <button data-add="rect" class="small">▭ Box</button>
        <button data-add="line" class="small">│ Line</button>
      </div>
      <label class="lbl">Zoom <input id="dzZoom" type="range" min="2" max="12" value="6" step="1" style="width:80px"></label>
      <div class="group tpl">
        <select id="tplList" title="Saved layouts"><option value="">Layouts…</option></select>
        <input id="tplName" placeholder="name" size="10">
        <button id="tplSave" class="small">Save</button>
        <button id="tplDelete" class="small" title="Delete selected layout">✕</button>
        <button id="tplExport" class="small">Export</button>
        <button id="tplImport" class="small">Import</button>
        <input type="file" id="tplImportFile" accept=".json" hidden>
        <button id="tplReset" class="small" title="Start over with the rod-wrap layout">Reset</button>
      </div>
    </div>
    <div class="dz-stage" id="dzStage"><canvas id="dzCanvas"></canvas></div>
    <div class="dz-help">Drag to move · handles resize · ⌫ delete · ⌘D duplicate · arrows nudge · double-click background to fit · tokens: <code>{text}</code> <code>{n}</code> <span id="dzTokens"></span></div>
    <div id="dzProps" class="dz-props"></div>
    <input type="file" id="dzImageFile" accept="image/*" hidden>
  </section>
</main>

<footer class="dock" id="dock">
  <div class="dock-head">
    <strong>Tape preview</strong>
    <span id="previewStats" class="muted"></span>
    <label class="lbl">Zoom <input type="range" id="zoom" min="0.5" max="4" step="0.25" value="1.5" style="width:110px"><span id="zoomTxt"></span></label>
    <span class="spacer"></span>
    <button id="btnExport" title="Save every label as a PNG to a folder you choose">Export PNGs</button>
    <button id="btnPrint" class="primary">Print</button>
  </div>
  <div class="strip-wrap"><div id="strip" class="strip"></div></div>
</footer>

<!-- PRINT THEATER -->
<div id="theater" class="theater hidden">
  <div class="theater-inner">
    <div class="theater-head">
      <div><strong id="thTitle">Printing</strong> <span id="thSub" class="muted"></span></div>
      <div class="row">
        <label class="check"><input type="checkbox" id="thSound"> Sound</label>
        <button id="thCancel">Cancel job</button>
        <button id="thFeedCut" class="hidden">Feed &amp; cut</button>
        <button id="thClose" class="hidden">Close</button>
      </div>
    </div>
    <div class="scene" id="scene">
      <svg id="printerSvg" viewBox="0 0 520 300" width="520" height="300" aria-label="Brother PT-P700"></svg>
      <div class="label-out" id="labelOut"></div>
      <div class="pile" id="pile"></div>
    </div>
    <div class="progress"><div class="bar" id="thBar"></div></div>
    <div id="thStatus" class="th-status"></div>
    <div id="thList" class="th-list"></div>
  </div>
</div>

<!-- SETTINGS -->
<div id="settings" class="modal hidden">
  <div class="modal-card">
    <h3>Settings</h3>
    <label class="check"><input type="checkbox" id="optAutoCut" checked> Auto-cut between labels</label>
    <label class="field"><span>Cut every N labels</span><input type="number" id="optCutEach" value="1" min="1" max="255"></label>
    <label class="field"><span>Feed margin (mm each side, min 2.0)</span><input type="number" id="optMarginMm" value="2" min="2" max="30" step="0.5"></label>
    <label class="field"><span>Vertical offset (dots) <small>(positive moves ink toward the top of the label; 7 dots = 1 mm)</small></span><input type="number" id="optOffset" value="2" min="-20" max="20" step="1"></label>
    <label class="check"><input type="checkbox" id="optMirror"> Mirror print</label>
    <label class="check"><input type="checkbox" id="optFlip"> Flip pin order <small>(only if a print comes out upside-down)</small></label>
    <label class="check"><input type="checkbox" id="optCheck" checked> Verify the loaded tape matches before printing</label>
    <div class="row"><button id="btnFeedCut" class="small">Feed &amp; cut now</button><span class="hint">Feeds the tape to the cutter and cuts.</span></div>
    <hr>
    <label class="check"><input type="checkbox" id="optMock"> Mock printer <small>(no USB needed; simulates printing)</small></label>
    <label class="field"><span>Mock tape width</span><select id="optMockTape"><option>6</option><option>9</option><option>12</option><option>18</option><option>24</option></select></label>
    <hr>
    <div class="row"><span id="verTxt" class="muted"></span><span class="spacer"></span><button id="btnCheckUpdates">Check for updates</button></div>
    <div id="updateTxt" class="hint" style="margin-top:6px"></div>
    <div class="row end" style="margin-top:12px"><button id="settingsClose" class="primary">Done</button></div>
  </div>
</div>

<div id="toast" class="toast hidden"></div>

<script src="vendor/qrcode.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
