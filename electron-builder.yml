appId: xyz.williamweaver.tapedeck
productName: TapeDeck
copyright: Copyright © 2026 William Weaver
directories:
  buildResources: build
  output: dist
files:
  - src/**/*
  - package.json
  - "!**/*.map"
asarUnpack:
  - node_modules/usb/**
npmRebuild: false          # node-usb ships N-API prebuilds for every target; no toolchain needed
publish:
  provider: github
  owner: Gene-Weaver
  repo: TapeDeck
  releaseType: release
mac:
  category: public.app-category.utilities
  icon: build/icon.png
  identity: null           # unsigned: users right-click > Open the first time
  hardenedRuntime: false
  artifactName: ${productName}-${version}-mac-${arch}.${ext}
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
win:
  icon: build/icon.png
  target:
    - target: nsis
      arch: [x64]
  artifactName: ${productName}-${version}-win-${arch}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
linux:
  icon: build/icon.png
  category: Utility
  maintainer: William Weaver <willwe@umich.edu>
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  artifactName: ${productName}-${version}-linux-${arch}.${ext}
